[package]
name = "perseids"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Run a repo's GitHub Actions jobs on fresh Boat boxes, all at once"
repository = "https://github.com/kkeeland/perseids"

[[bin]]
name = "perseids"
path = "src/main.rs"

[dependencies]
serde_yaml = "0.9"
serde_json = { version = "1", features = ["preserve_order"] }
ureq = "2"
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
