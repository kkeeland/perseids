jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [a, b]
        node: [18, 20]
        py: [3.10, "3.12"]
        exclude:
          - { os: b, node: 18 }
        include:
          - { node: 20, extra: x }
          - { os: c, node: 22 }
  objs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cfg: [{ name: one, n: 1 }, { name: two, n: 2 }]
  only-include:
    runs-on: ubuntu-latest
    strategy: { matrix: { include: [{ a: 1 }, { a: 2, b: y }] } }
  expr-matrix:
    runs-on: ubuntu-latest
    strategy: { matrix: "${{ fromJSON(needs.x.outputs.m) }}" }
  expr-key:
    runs-on: ubuntu-latest
    strategy: { matrix: { os: "${{ fromJSON('[1]') }}" } }
